[project]
name = "payments_api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<0.142", "httpx>=0.28,<0.29"]

[dependency-groups]
dev = ["mypy>=2.3,<2.4", "pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: integration tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["payments_api"]
