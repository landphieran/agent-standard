# Example 3 — greenfield Next.js full-stack app, clean/layered architecture.
# Blocking gate, Claude + Copilot, required CI, Vitest unit + Playwright e2e layout.
#
#   copier copy --trust --vcs-ref HEAD --data-file examples/3-ts-next-clean-strict.yml \
#     gh:landphieran/agent-standard ./web-app
setup_profile: advanced
project_name: web-app
language_stack: ts-next
codeowners: "@example/web"
architecture: clean-layered
topology: single-deployable
mode: greenfield
workflow_profile: spec-driven
gate: strict
agents:
  - claude
  - copilot
ci: true
bom_format: both
bom_gate: strict
security_profile: hardened
release_attestations: true
