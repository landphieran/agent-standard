# Example 3 — greenfield Next.js full-stack app, clean/layered architecture.
# Blocking gate, Claude + Copilot, required CI, Vitest unit + Playwright e2e layout.
#
#   copier copy --trust --data-file examples/3-ts-next-clean-strict.yml \
#     gh:landphieran/agent-standard ./web-app
project_name: web-app
language_stack: ts-next
architecture: clean-layered
mode: greenfield
gate: strict
agents:
  - claude
  - copilot
ci: true
