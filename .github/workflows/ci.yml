name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/1-py-fastapi-adopt-advisory.yml
          - examples/2-ts-node-service-strict.yml
          - examples/3-ts-next-clean-strict.yml
          - examples/4-py-fastapi-clean-strict.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.8"
          enable-cache: true
      - shell: pwsh
        run: ./scripts/verify-render.ps1 -Example "${{ matrix.example }}" -SourceRef HEAD
  update-round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.8"
          enable-cache: true
      - shell: pwsh
        run: ./scripts/verify-render.ps1 -Example examples/2-ts-node-service-strict.yml -SourceRef HEAD -UpdateRoundTrip
