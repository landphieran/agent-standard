name: CI
on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  source:
    name: Source and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/0-ts-node-standard.yml
          - examples/1-py-fastapi-adopt-advisory.yml
          - examples/2-ts-node-service-strict.yml
          - examples/3-ts-next-clean-strict.yml
          - examples/4-py-fastapi-clean-strict.yml
          - examples/5-ts-node-azure-devops-standard.yml
          - examples/6-ts-node-azure-devops-extends.yml
          - examples/7-ts-node-adopt.yml
          - examples/8-ts-next-adopt.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.8"
          enable-cache: true
      - shell: pwsh
        run: ./scripts/verify-render.ps1 -Example "${{ matrix.example }}" -SourceRef "${{ github.sha }}"
  update-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.8"
          enable-cache: true
      - shell: pwsh
        run: |
          ./scripts/verify-render.ps1 -Example examples/2-ts-node-service-strict.yml -SourceRef "${{ github.sha }}" -UpdateRoundTrip
          ./scripts/verify-render.ps1 -Example examples/6-ts-node-azure-devops-extends.yml -SourceRef "${{ github.sha }}" -UpdateRoundTrip
  portable:
    name: Portable release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.8"
          enable-cache: true
      - run: npm ci
      - run: npm run verify:portable
